<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Data Cube · Отчёт беты</title>
<!-- The beta dashboard: summary strip, charts with cross-filters (sidebar on wide screens, a fold-out on narrow), a grouped feed
     and the detail pane / sheet. Phone: a sheet is closed by a sideways swipe (or down from its top), a row swiped right closes /
     reopens the report, swiped left or long-pressed opens its actions; long press on facets, groups and chart bars — "only this" /
     "exclude". Tabs: reports, players, levels and crashes (gameplay telemetry — beta/worker/TELEMETRY.md). Needs the worker's READ_KEY
     (?k= once — remembered in this browser); without config.js or with ?demo — made-up data in the worker's format.
     The previous dashboard is kept as feedback-old.html -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap">
<script src="config.js"></script>
<style>
/* Layout: header · strip · toolbar, then [analytics] list [detail]: three columns from 1280 px, list + detail from 820, one column below (detail in a sheet) */
:root{
  color-scheme:dark;
  --bg:#140d26;--bg2:#1b1333;--card:#241a43;--card2:#2f2257;--line:#382a66;--line2:rgba(255,255,255,.06);
  --txt:#ece6fb;--dim:#bdb2dd;--dim2:#9d91c4;--gold:#ffd66b;--gold-ink:#2a1d50;
  --bug:#ff7a8a;--op:#8fb8ff;--ok:#8be3a0;--warn:#ffb36b;
  --f-disp:Fredoka,Nunito,system-ui,sans-serif;--f-body:Nunito,system-ui,sans-serif;--f-mono:ui-monospace,SFMono-Regular,Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#0d0819;color:var(--txt);font:14px/1.4 var(--f-body);display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top,0px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--gold)}
:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
/* No scrollbars anywhere: a scroller with more content past an edge shows an arrow there (moAll) */
*{scrollbar-width:none}
*::-webkit-scrollbar{display:none}
.mol{position:absolute;inset:0;pointer-events:none}
.mo{position:absolute;z-index:var(--z,4);width:30px;height:18px;border:1px solid var(--line);border-radius:9px;background:rgba(36,26,67,.9);color:var(--gold);display:grid;place-items:center;padding:0;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .2s;box-shadow:0 2px 8px rgba(0,0,0,.45)}
.mo.on{opacity:1;pointer-events:auto}
.mo.l,.mo.r{width:18px;height:26px}
.mo svg{width:12px;height:12px}
.mo.d svg{transform:rotate(180deg)} .mo.l svg{transform:rotate(-90deg)} .mo.r svg{transform:rotate(90deg)}
.oi{width:14px;height:14px;vertical-align:-2px;margin-right:3px;flex:none}
.ccf{white-space:nowrap;display:inline-flex;align-items:center;gap:0;vertical-align:baseline}
.flg{height:.82em;width:auto;border-radius:2px;vertical-align:-.04em;margin-right:3px;box-shadow:0 0 0 1px rgba(255,255,255,.14)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:none}
.seg button{border:0;background:var(--card);padding:4px 10px;white-space:nowrap;transition:background .15s,color .15s}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--gold);color:var(--gold-ink);font-weight:800}
.seg.sm button{padding:3px 8px;font-size:12.5px}

#stage{flex:1;min-height:0;display:flex;justify-content:center;align-items:stretch;overflow:hidden}
.app{position:relative;width:100%;height:100%;min-height:0;max-height:100%;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;container:app/inline-size}

/* Header */
.hd{flex:none;display:flex;align-items:center;gap:8px;padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));background:linear-gradient(90deg,#221741,#33245f);border-bottom:1px solid var(--line)}
.hd svg.logo{width:22px;height:22px;flex:none}
.tabs{display:flex;gap:2px;background:rgba(0,0,0,.2);border-radius:10px;padding:2px;position:relative}
.tabs button{border:0;background:none;border-radius:8px;padding:5px 10px;font-weight:700;display:flex;align-items:center;gap:6px;color:var(--dim);transition:color .2s,background .2s}
.tabs button[aria-pressed=true]{background:var(--card2);color:var(--txt)}
.tabs .c{font-size:11.5px;color:var(--dim);font-weight:800}
.tabs .ti.lt{filter:grayscale(1) brightness(2.4)}
@container app (max-width:560px){ .tabs .tl{display:none} .tabs button{padding:5px 8px;gap:4px} }
.tabs .lvd{color:var(--ok);font-size:11.5px}
.tabs .nw{background:var(--gold);color:#000;border-radius:7px;padding:0 5px;font-size:11px;font-weight:800;animation:pop .35s var(--ease)}
.hd .sp{flex:1}
.live{font-size:11.5px;color:var(--dim);white-space:nowrap}
.live::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);margin-right:5px;vertical-align:1px;animation:blink 2.4s infinite}
.live.off::before{background:var(--bug);animation:none}
.ib{border:1px solid var(--line);background:var(--card);border-radius:8px;min-width:30px;height:30px;display:inline-grid;place-items:center;flex:none;padding:0 6px;transition:background .15s,transform .15s}
.ib:hover{background:var(--card2)}
.ib:active{transform:scale(.92)}
.ib:disabled{opacity:.5}
.ib[aria-pressed=true]{background:var(--card2);border-color:var(--gold);color:var(--gold)}
.spin{animation:spin .8s linear infinite}
@container app (max-width:520px){ .live{display:none} }

/* Strip: a number and its label on one line, tappable as a filter */
.strip{flex:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.st{background:var(--bg2);padding:6px 10px;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:8px;align-items:center;border:0;text-align:left;min-width:0;transition:background .15s}
@container app (max-width:600px){ .st{padding:5px 6px;column-gap:4px} .st b{font-size:15px} .st span{font-size:10px} }
.st b{font:600 19px/1.1 var(--f-disp);font-variant-numeric:tabular-nums;grid-row:1/3;min-width:1ch}
.st span{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st svg{width:100%;height:14px}
button.st:hover{background:var(--card)}
button.st[aria-pressed=true]{background:var(--card);box-shadow:inset 0 -2px 0 var(--gold)}

/* Toolbar: one row. Search takes the space up to the next control; charts, grouping and the filter sit on the right. Chips wrap under the row. */
.flt{flex:none;display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:7px max(12px,env(safe-area-inset-right,0px)) 7px max(12px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--bg2)}
.f1{flex:1 1 100%;min-width:0;display:flex;gap:6px;flex-wrap:nowrap;align-items:center}
.fr{margin-left:auto;display:flex;gap:6px;align-items:center;flex:none}
.f1 .sel{flex:none;width:132px;max-width:132px}
.fdrop{position:relative;flex:none;z-index:30}
.fdrop>.ib{background:transparent;border-color:transparent;color:var(--dim2)}
.fdrop>.ib:hover{background:var(--card);color:var(--txt)}
.fdrop>.ib[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.fdrop>.ib[aria-pressed=true]:hover{background:var(--gold);color:var(--gold-ink)}
.fpop{position:absolute;right:0;top:calc(100% + 4px);z-index:40;width:min(260px,78vw);max-height:min(360px,calc(100dvh - 180px));overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 14px 40px rgba(0,0,0,.6)}
.fsec+.fsec{border-top:1px solid var(--line2);margin-top:4px;padding-top:4px}
.fpop button.fh{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;border-radius:8px;padding:4px 8px;text-align:left;font:800 10.5px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--dim2)}
.fpop button.fh:hover{background:var(--card2);color:var(--txt)}
.fpop button.fh .ar{margin-left:auto;width:10px;transition:transform .2s var(--ease)}
.fsec.shut .fh .ar{transform:rotate(-90deg)}
.fpop button{display:block;width:100%;border:0;background:none;border-radius:8px;padding:6px 8px;text-align:left;font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fpop button:hover{background:var(--card2)}
.fpop button[aria-pressed=true]{background:var(--gold);color:var(--gold-ink)}
.srch{flex:1 1 auto;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:5px 10px;font-size:13px}
.sel{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:4px 6px;font-size:12.5px;max-width:160px}
.chips{display:flex;gap:5px;flex-wrap:wrap;align-items:center;width:100%}
.chips:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--gold);color:var(--gold);background:rgba(255,214,107,.08);border-radius:99px;padding:1px 4px 1px 9px;font-size:12px;font-weight:700;max-width:100%;animation:pop .3s var(--ease)}
.chip.not{border-color:var(--bug);color:var(--bug);background:rgba(255,122,138,.08)}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip button{border:0;background:none;color:inherit;padding:0 4px;font-size:13px;line-height:1}
.clr{border:0;background:none;color:var(--dim);font-size:12px;text-decoration:underline;padding:0 2px}

/* Body: [analytics] list [pane] */
.body{flex:1;min-height:0;display:flex}
.scr{overflow:auto;min-height:0;overscroll-behavior:contain}
.side{display:none;flex:0 0 var(--sw,360px);min-width:0;border-right:1px solid var(--line)}
.list{flex:1;min-width:0}
.pane{display:none;flex:1;min-width:0}
@container app (min-width:820px){ .list{flex:0 0 var(--lw,420px);border-right:1px solid var(--line)} .pane{display:block;container:pane/inline-size} }
@container app (min-width:1280px){ .side{display:block} }
/* Dividers between the panels: dragged sideways to resize (double click — the default width) */
.spl{flex:none;width:9px;margin:0 -5px 0 -4px;position:relative;z-index:3;cursor:col-resize;touch-action:none}
.spl::after{content:'';position:absolute;top:0;bottom:0;left:3px;width:3px;border-radius:2px;background:transparent;transition:background .15s}
.spl:hover::after,.spl.on::after{background:var(--gold)}
body.spl-on{cursor:col-resize;user-select:none}

/* Analytics */
.ana{display:grid;gap:10px;padding:10px 12px;align-content:start}
.fold{border-bottom:1px solid var(--line);background:#170f2d}
.fold.in{animation:fold .35s var(--ease)}
.fold.out{animation:fold .25s var(--ease) reverse forwards}
/* Narrow layout: the chart cards stay one row and slide sideways, instead of stacking down the list */
.fold .ana{display:flex;flex-wrap:nowrap;align-items:flex-start;overflow-x:auto;scroll-snap-type:x proximity}
.fold .ana>.card{flex:0 0 min(320px,86cqw);scroll-snap-align:start}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:8px;min-width:0}
.card h3{margin:0;font:600 14px var(--f-disp);display:flex;align-items:center;gap:4px 8px;flex-wrap:wrap}
.card h3 small{font:700 11.5px var(--f-body);color:var(--dim)}
.card h3 .sp{flex:1}
/* The section's total, next to the title — the same number the bars add up to */
.hn{font:800 12px/1.5 var(--f-body);font-variant-numeric:tabular-nums;color:var(--txt);background:rgba(255,255,255,.08);border-radius:99px;padding:0 7px;letter-spacing:0;text-transform:none;flex:none}
.sub .hn{margin-right:auto}
.lsum{display:flex;align-items:center;gap:8px;padding:0 12px;height:32px;border-bottom:1px solid var(--line2);background:#1a1231;font-size:12.5px;position:sticky;top:0;z-index:3}
.list:has(> .lsum) .gh{top:32px}
.lsum b{font-size:13px}
.lsum .sp{flex:1}
.lsum small{color:var(--dim);font-weight:700;font-size:11.5px}
.lsum .n{font-weight:800;font-variant-numeric:tabular-nums;display:inline-flex;gap:4px;align-items:baseline}
.lg{display:inline-flex;gap:10px;font:700 11px var(--f-body);color:var(--dim)}
.lg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
.cc{display:grid;grid-template-columns:auto 1fr;gap:4px 6px}
.cc .ya{display:flex;flex-direction:column;justify-content:space-between;font-size:10.5px;color:var(--dim2);text-align:right;height:96px}
.cc .bars{height:96px;display:flex;align-items:flex-end;gap:2px;background:repeating-linear-gradient(to top,var(--line2) 0 1px,transparent 1px 24px);border-bottom:1px solid var(--line)}
.cc .b{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;border:0;background:none;padding:0;min-width:0;border-radius:2px 2px 0 0;transform-origin:bottom;transition:background .15s}
.cc .b i{display:block;width:100%;transition:opacity .2s}
.cc .b i:first-child{border-radius:2px 2px 0 0}
.cc .b:hover{background:rgba(255,255,255,.05)}
.cc .b.dim i{opacity:.28}
.cc .b.on{background:rgba(255,214,107,.14);box-shadow:inset 0 -2px 0 var(--gold)}
.cc .xa{grid-column:2;display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim2)}
.cap{font-size:12px;color:var(--dim);min-height:17px}
.cap b{color:var(--txt)}
.dims{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.dims button{border:1px solid var(--line);background:none;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700;color:var(--dim);white-space:nowrap;transition:all .15s}
.dims button[aria-pressed=true]{background:var(--card2);color:var(--txt);border-color:var(--dim2)}
.bl{display:grid;gap:2px}
.bi{display:grid;grid-template-columns:minmax(0,40%) 1fr auto;gap:8px;align-items:center;border:0;background:none;padding:3px 4px;border-radius:6px;text-align:left;font-size:12.5px;transition:background .15s}
button.bi:hover{background:rgba(255,255,255,.04)}
.bi.on{background:rgba(255,214,107,.12);outline:1px solid rgba(255,214,107,.5)}
.bi.no{opacity:.45;text-decoration:line-through}
.bi.hot{outline:1px solid var(--warn)}
.bi .l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bi .l small{color:var(--dim2);margin-left:4px}
.bi .tr{height:10px;display:flex;border-radius:3px;overflow:hidden}
.bi .tr i{display:block;height:100%}
.bi .v{font-weight:800;font-size:12px;min-width:22px;text-align:right}
.more{border:0;background:none;color:var(--gold);font-size:12px;font-weight:700;justify-self:start;padding:2px 4px}
/* The level × version matrix fits its card (no sideways scroll — the card's swipe stays free) */
.hm{overflow:hidden}
.hm table{border-collapse:separate;border-spacing:2px;font-size:11px;width:100%;table-layout:fixed}
.hm th{color:var(--dim);font-weight:700;padding:0 4px;white-space:nowrap;text-align:right;overflow:hidden;text-overflow:ellipsis}
.hm thead th{text-align:center;font-size:10px;padding:0}
.hm col.n{width:38%}
.hm td{padding:0}
.hm td button{width:100%;min-width:0;height:22px;border:0;border-radius:4px;font-size:11px;font-weight:800;color:var(--txt);background:rgba(255,122,138,var(--a));transition:transform .15s}
.hm td button:hover{transform:scale(1.08)}
.hm td button.z{color:transparent;background:rgba(255,255,255,.03)}
.hm td button.on{outline:2px solid var(--gold)}
.pc{display:grid;grid-template-columns:22px repeat(24,minmax(0,1fr));gap:2px;font-size:10px;color:var(--dim2);align-items:center}
.pc i{aspect-ratio:1;border-radius:2px;background:rgba(139,227,160,var(--a));min-width:0}
.pc .hx{text-align:center}

/* Groups */
.gh{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;width:100%;border:0;border-bottom:1px solid var(--line2);background:#1a1231;padding:6px 12px;text-align:left;-webkit-touch-callout:none;user-select:none}
.gh .ar{width:10px;color:var(--dim);transition:transform .2s var(--ease)}
.gh.shut .ar{transform:rotate(-90deg)}
.gh .ar,.gh b{flex:none}
.gh b{font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gh b small{color:var(--dim2);font-weight:700;margin-left:4px}
.gh small{color:var(--dim);font-size:11.5px;white-space:nowrap}
.gh .sp{flex:1}
.mb{display:flex;width:64px;height:6px;border-radius:3px;overflow:hidden;background:rgba(255,255,255,.07);flex:none}
.mb i{display:block;height:100%}
.gh .n{font-weight:800;font-size:12.5px;min-width:18px;text-align:right}

/* Rows (reports and players) — swipeable, long-pressable */
.sw{position:relative;overflow:hidden;border-bottom:1px solid var(--line2)}
.sw .bk{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-weight:800;font-size:13px;opacity:0;transition:opacity .15s}
.sw .bk .r{color:var(--ok)} .sw .bk .l{color:var(--gold)}
.sw.drag .bk{opacity:1}
.sw.drag.right .bk{background:linear-gradient(90deg,rgba(139,227,160,.22),transparent 70%)}
.sw.drag.left .bk{background:linear-gradient(270deg,rgba(255,214,107,.18),transparent 70%)}
.sw.go .bk .r,.sw.go .bk .l{transform:scale(1.15);transition:transform .15s}
.row,.prow{display:grid;width:100%;border:0;background:var(--bg);text-align:left;padding:7px 12px;position:relative;touch-action:pan-y;-webkit-touch-callout:none;user-select:none;transition:background .15s,transform .25s var(--ease)}
.row{grid-template-columns:44px 1fr;gap:10px}
.row:hover,.prow:hover{background:#1a1230}
.row.on,.prow.on{background:var(--card)}
.row.on::before,.prow.on::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold);animation:bar .25s var(--ease)}
.row.closed .rm,.row.closed .th{opacity:.55}
.press{transform:scale(.98)!important;background:var(--card)!important;transition:transform .45s ease-out,background .45s}
.flash{animation:flash .9s ease-out}
.th{width:44px;height:44px;border-radius:8px;display:grid;place-items:center;font-size:17px;overflow:hidden;border:1px solid var(--line);background:#0d0819}
.th img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.th.pic{background:linear-gradient(160deg,hsl(var(--h) 55% 62%),hsl(calc(var(--h) + 40) 45% 28%))}
.th svg{width:18px;height:18px;opacity:.9}
.rm{min-width:0;display:grid;gap:1px}
.r1{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--dim);min-width:0}
.r1 b{color:var(--txt);font-size:13px;white-space:nowrap}
.r1 .lv{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.r1 .t{margin-left:auto;white-space:nowrap;flex:none}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.bug{background:var(--bug)} .dot.opinion{background:var(--op)}
.r2{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r3{display:flex;gap:9px;font-size:11.5px;color:var(--dim2);white-space:nowrap;overflow:hidden}
.r3 .e{color:var(--bug)}
.r3 .wp{color:var(--warn);font-weight:800} .r3 .wp.dn{color:var(--ok)}
.tag{font-size:10px;font-weight:800;background:var(--gold);color:#000;border-radius:6px;padding:0 5px}
.tag.chg{background:rgba(255,255,255,.18);color:var(--txt)}
.prow{gap:3px}
.p1{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);min-width:0}
.p1 b{color:var(--txt);font-size:13.5px}
.p1 .t{margin-left:auto;white-space:nowrap}
.lvb{color:var(--ok);font-weight:800;font-size:11.5px;white-space:nowrap}
.lvb::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:4px;animation:blink 1.6s infinite}
.ban b{color:var(--bug)!important}
.p2{display:grid;grid-template-columns:minmax(60px,1fr) auto;gap:8px;align-items:center;font-size:11.5px;color:var(--dim)}
.tb{height:6px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden}
.tb i{display:block;height:100%;background:var(--gold);border-radius:3px;transform-origin:left}
.p2 .m{white-space:nowrap}
.p2 .m b{color:var(--txt)}
.empty{padding:40px 16px;text-align:center;color:var(--dim)}
.tg{font-size:10.5px;font-weight:800;border-radius:6px;padding:0 5px;background:rgba(255,122,138,.16);color:var(--bug);white-space:nowrap}
.tg.w{background:rgba(255,179,107,.16);color:var(--warn)}
.p1 small{font-size:11px}
.msg{font:12px/1.35 var(--f-mono);color:#ffc9d1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
pre.emsg{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.4 var(--f-mono);color:#ffc9d1;background:var(--card);border-left:3px solid var(--bug);border-radius:0 10px 10px 0;padding:10px 12px}
/* A level's height map with deaths: darker = lower, blue = water, red = where the cube dies */
.hmap{display:grid;gap:1px;width:min(100%,calc(var(--mh,62vh)*var(--ar,1)));background:transparent;justify-self:center;margin:0 auto}
.hmap[data-act]{cursor:zoom-in}
#lb .hmap{--mh:80vh;width:min(94vw,calc(80vh*var(--ar,1)));cursor:zoom-out}
#lb .lbm{display:grid;gap:10px;justify-items:center}
.lbh{font:600 17px var(--f-disp);color:var(--txt);text-align:center}
.lbh small{display:block;font:700 12.5px var(--f-body);color:var(--dim)}
.hmap i{aspect-ratio:1;border-radius:1px;position:relative;min-width:0}
.hmap i b{position:absolute;inset:0;border-radius:1px;background:rgba(255,70,95,var(--d))}
.hmap.dsel i b{background:rgba(255,70,95,calc(var(--d)*.25))}
.hmap.dsel i b.hi{background:rgba(255,40,70,var(--d));box-shadow:0 0 0 1px #ffd0d8,0 0 8px rgba(255,60,90,.9);z-index:1}
.hmap i[data-tip]{cursor:help}
.hmap i s{position:absolute;inset:14%;border-radius:50%;text-decoration:none;z-index:2}
.hmap i s.g{background:var(--gold);box-shadow:0 0 6px rgba(255,214,107,.8)}
.hmap i s.o{border:2px solid var(--gold);inset:10%}
.hmap i s.n::after{content:attr(data-n);position:absolute;inset:0;display:grid;place-items:center;font:800 9px var(--f-body);color:var(--gold-ink)}
.err{color:var(--bug)}
.hint{padding:10px 12px 18px;color:var(--dim2);font-size:11.5px;text-align:center}

/* Detail */
.dt{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;padding:12px 14px 0;align-content:start}
.dt.fresh{animation:rise .3s var(--ease)}
.dt-h{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.badge{padding:1px 9px;border-radius:99px;font-weight:800;font-size:12px}
.badge.bug{background:rgba(255,122,138,.16);color:var(--bug)} .badge.opinion{background:rgba(143,184,255,.16);color:var(--op)}
.badge.closed{background:rgba(139,227,160,.14);color:var(--ok)} .badge.open{background:rgba(255,255,255,.08);color:var(--dim)} .badge.wip{background:rgba(255,179,107,.16);color:var(--warn)} .badge.done{background:rgba(139,227,160,.2);color:var(--ok)}
.dt-h .sp{flex:1}
.dt-h .no{color:var(--dim);font-size:12.5px;margin-right:4px}
/* The report's screenshot and text, with the facts beside them when the pane is wide (under them otherwise) */
.dtm{display:grid;gap:12px;align-items:start}
.dtl{display:grid;gap:12px;min-width:0}
@container pane (min-width:700px){ .dtm{grid-template-columns:minmax(0,1.6fr) minmax(220px,1fr)} }
.shot{display:block;max-width:100%;max-height:46vh;border-radius:10px;border:1px solid var(--line);cursor:zoom-in;background:#0d0819;justify-self:start}
.shot.ph{width:100%;aspect-ratio:16/9;display:grid;place-items:center;background:linear-gradient(170deg,hsl(var(--h) 55% 62%),hsl(calc(var(--h) + 40) 45% 26%));cursor:default}
.shot.ph svg{width:46px;height:46px;animation:bob 3s ease-in-out infinite}
blockquote{margin:0;padding:10px 12px;background:var(--card);border-left:3px solid var(--gold);border-radius:0 10px 10px 0;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
audio{width:100%;max-width:520px}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));background:var(--bg2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.facts div{background:var(--bg2);padding:6px 10px;min-width:0;box-shadow:1px 0 0 var(--line),0 1px 0 var(--line)}
.facts span{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim2);font-weight:800}
.facts b{display:block;font-weight:700;font-size:13px;overflow-wrap:anywhere}
.facts small{display:block;color:var(--dim);font-size:11.5px;overflow-wrap:anywhere}
details.box{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
details.box summary{cursor:pointer;font-weight:700;font-size:13px}
details.box.e summary{color:var(--bug)}
details.box pre{white-space:pre-wrap;overflow-wrap:anywhere;font:11.5px/1.4 var(--f-mono);color:#ffc9d1;margin:8px 0 0}
details.box p{margin:6px 0 0;font-size:12px;color:var(--dim);overflow-wrap:anywhere}
.rep{display:grid;gap:8px}
.rep h3{margin:0;font:600 15px var(--f-disp);display:flex;align-items:center;gap:8px}
.rep .r{background:var(--card);border-radius:10px;padding:7px 10px;white-space:pre-wrap;font-size:13.5px;overflow-wrap:anywhere;animation:rise .3s var(--ease)}
.rep .r small,.note{display:block;color:var(--dim);font-size:11.5px;white-space:normal}
.rep textarea{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:7px 10px;min-height:56px;resize:vertical;width:100%;transition:border-color .2s}
.rep textarea:focus{border-color:var(--gold);outline:0}
.tgs,.tbar{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.tgs .tlbl{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim2);font-weight:800;margin-right:2px}
.tbar{padding:0 2px 6px}
.tbar .chip{cursor:pointer;border-color:var(--line);color:var(--dim);background:transparent;padding:2px 9px}
.tbar .chip.on{border-color:var(--gold);color:var(--gold);background:rgba(255,214,107,.12)}
.tgin{width:7.5em;background:transparent;border:1px dashed var(--line);border-radius:99px;padding:2px 9px;font:700 12px var(--f-body);color:var(--txt)}
.tgin:focus{outline:0;border-color:var(--gold)}
.qbox{position:relative}
.qbox textarea{width:100%;min-height:88px;resize:vertical;background:var(--card);border:1px solid var(--gold);border-radius:10px;padding:10px 12px;font-size:15px}
.qbox .pen{position:absolute;top:6px;right:6px;background:var(--bg2)}
.qbox blockquote{padding-right:40px}
.qbox .sav{position:absolute;inset:0;display:grid;place-items:center;background:rgba(13,8,25,.72);border-radius:10px;font-weight:800;color:var(--gold)}
.rbox{display:grid;gap:8px;border-radius:10px;padding:2px;transition:box-shadow .15s,background .15s}
.rbox.on{background:rgba(255,214,107,.08);box-shadow:inset 0 0 0 2px var(--gold)}
.rtools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rtools .sp{flex:1}
.rthumbs{display:flex;flex-wrap:wrap;gap:8px}
.rth{position:relative;display:inline-block}
.rshot{display:block;max-width:220px;max-height:140px;border-radius:8px;border:1px solid var(--line)}
.rth .rx{position:absolute;top:4px;right:4px;width:22px;height:22px;border:0;border-radius:50%;background:rgba(13,8,25,.82);color:#fff;font-weight:800;line-height:22px;opacity:0;cursor:pointer}
.rth:hover .rx,.rth:focus-within .rx{opacity:1}
.tgs .add{cursor:pointer;border-style:dashed}
.btn{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:6px 11px;display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px;white-space:nowrap;text-decoration:none;color:var(--txt);transition:background .15s,transform .15s}
.btn:hover{background:var(--card2)}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.5}
.btn.pri{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-weight:800}
.btn.dng{background:var(--bug);border-color:var(--bug);color:#2a0d14;font-weight:800}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:8px}
.btn[aria-pressed=true]{background:rgba(255,179,107,.16);border-color:var(--warn);color:var(--warn)}
.sub{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim2);font-weight:800;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.sub em{font-style:normal;text-transform:none;letter-spacing:0;color:var(--dim);font-weight:700}
.days{display:flex;align-items:flex-end;gap:2px;height:34px;border-bottom:1px solid var(--line)}
.days i{flex:1;background:var(--gold);border-radius:1px 1px 0 0;min-height:1px;transform-origin:bottom}
.days i.z{background:rgba(255,255,255,.06);height:2px!important}
.prog{display:grid;gap:8px}
.prog .ar{display:flex;flex-direction:column;align-items:stretch;gap:4px;font-size:11.5px;color:var(--dim)}
.prog .ar>span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog .ar>span:first-child b{color:var(--txt);font-weight:800}
.cells{display:flex;flex-wrap:wrap;gap:3px;width:100%}
.cells > i{width:28px;height:28px;min-width:28px;max-width:28px;flex:0 0 28px;border-radius:4px;background:#140e22;cursor:pointer;transition:transform .12s;display:grid;place-items:center;overflow:hidden;padding:2px}
.cells > i:hover{transform:scale(1.35);box-shadow:0 0 0 1px var(--gold);z-index:2}
.cells > i .hmap{width:100%;gap:0;--mh:24px;margin:0}
.cells > i .hmap i{width:auto;height:auto;border-radius:0;outline:none;box-shadow:none;animation:none;cursor:inherit;padding:0}
.cells > i.d{box-shadow:inset 0 0 0 2px rgba(139,227,160,var(--a))}
.cells > i.c{outline:2px solid var(--gold);outline-offset:-2px;animation:blink 1.6s infinite}
.cells > i.f{box-shadow:inset 0 0 0 2px var(--gold)}
.cells > i:not(:has(.hmap)){background:rgba(255,255,255,.07)}
.cells > i.d:not(:has(.hmap)){background:rgba(139,227,160,var(--a))}
.dl{display:grid;gap:4px;font-size:12.5px}
.dl div{display:flex;gap:2px 6px;flex-wrap:wrap;align-items:baseline}
.dl small{color:var(--dim);font-size:11.5px}
.pa{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pa .sp{flex:1}
.lnk{color:var(--gold);font-weight:700;font-size:12.5px;cursor:pointer;border:0;background:none;padding:0}
.xt{overflow-x:auto}
.xt table{border-collapse:collapse;font-size:12px;width:100%}
.xt th{text-align:left;color:var(--dim);font-weight:700;padding:3px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.xt td{padding:3px 6px;border-bottom:1px solid var(--line2);white-space:nowrap}

/* The detail's head stays on top while its body scrolls */
.dhd{position:sticky;top:0;z-index:6;display:grid;gap:8px;margin:-12px -14px 0;padding:12px 14px 9px;background:var(--bg);border-bottom:1px solid var(--line2)}
.sheet .dhd{top:0}
.who{display:flex;align-items:center;gap:8px;min-width:0}
.who h2{margin:0;font:600 20px var(--f-disp);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .ccf{font-size:13px}
.who .dte{margin-left:auto;color:var(--dim);font-size:12.5px;white-space:nowrap;flex:none}
.who .oth{color:var(--dim);font-size:12.5px;white-space:nowrap}
.reg{margin-left:auto;text-align:right;font-size:12px;color:var(--dim);line-height:1.35;white-space:nowrap;flex:none}
.reg b{color:var(--txt);font-weight:700}
.dtr{display:grid;gap:12px;min-width:0;align-content:start}
.facts .wide{grid-column:1/-1}
.facts .ua{font:11.5px/1.4 var(--f-mono);color:var(--dim);overflow-wrap:anywhere;font-weight:400}
.badge.btnk{border:0;cursor:pointer}
.badge.btnk:hover{filter:brightness(1.25)}
/* A logo that opens the summary */
.lgb{border:0;background:none;padding:0;display:grid;place-items:center;border-radius:6px;flex:none;transition:transform .15s}
.lgb:hover{transform:rotate(-8deg) scale(1.1)}
.ab{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ab div{background:var(--bg2);padding:7px 10px}
.ab span{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim2);font-weight:800}
.ab b{font:600 18px var(--f-disp)}
.ab small{display:block;color:var(--dim);font-size:11.5px}
.share{display:grid;gap:6px}
.share>span{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim2);font-weight:800}
.share input{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font:12px/1.35 var(--f-mono);width:100%}
.share .row2{align-items:center}
.share small{color:var(--dim);font-size:12.5px}
/* An instant tooltip (data-tip), drawn by the page — not the browser's slow title */
#tip{position:fixed;z-index:60;pointer-events:none;background:#2f2257;border:1px solid var(--line);border-radius:8px;padding:5px 9px;font:12.5px/1.35 var(--f-body);color:var(--txt);white-space:pre-line;max-width:280px;box-shadow:0 6px 18px rgba(0,0,0,.5)}
#tip b{color:var(--gold)}
#tip .hmap{white-space:normal;width:200px;margin-top:6px;--mh:200px}
.tgs{position:relative}
.tgsug{position:absolute;z-index:8;top:100%;left:0;display:grid;min-width:9em;background:#2a1d4a;border:1px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:0 6px 16px rgba(0,0,0,.45)}
.tgsug button{text-align:left;border:0;background:transparent;padding:5px 10px;font-weight:700;color:var(--txt)}
.tgsug button:hover{background:var(--card)}
/* Deaths: causes (tap — that cause lights up on the map) beside the fps of the devices */
.lv2{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@container pane (min-width:560px){ .lv2{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)} }
.lv2>div{display:grid;gap:6px;align-content:start;min-width:0}
/* Player progress: expeditions, each folding out into its areas and level cubes */
.xp{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.xp+.xp{margin-top:6px}
.xh{display:flex;align-items:center;gap:8px;width:100%;border:0;background:var(--bg2);padding:7px 10px;text-align:left;font-size:12.5px;color:var(--dim)}
.xh:hover{background:var(--card)}
.xh b{color:var(--txt);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.xh .ar{width:10px;flex:none;transition:transform .2s var(--ease)}
.xh.shut .ar{transform:rotate(-90deg)}
.xh .sp{flex:1}
.xh span{white-space:nowrap}
.xb{display:grid;gap:6px;padding:8px 10px 10px;animation:rise .25s var(--ease)}

/* Sheet (phone): slides up; swiped sideways or down from its top, it flies off */
.sheet{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(5,3,12,calc(.55*var(--o,1)))}
.sheet.op{animation:fade .2s}
.sheet>.in{background:var(--bg);border-radius:18px 18px 0 0;border-top:1px solid var(--line);max-height:94%;display:flex;flex-direction:column;overflow:auto;overscroll-behavior:contain;touch-action:pan-y;box-shadow:0 -10px 40px rgba(0,0,0,.5)}
.sheet.op>.in{animation:up .3s var(--ease)}
.sheet>.in.pv-u{animation:pvU .3s var(--ease)}
.sheet>.in.pv-d{animation:pvD .3s var(--ease)}
@keyframes pvU{from{transform:translateY(70px);opacity:0}}
@keyframes pvD{from{transform:translateY(-70px);opacity:0}}
/* Paging between players: a pill names who comes next while the card is pulled past its scroll end */
.pvh{position:absolute;left:50%;z-index:2;transform:translate(-50%,0) scale(calc(.85 + .15*var(--k,0)));opacity:var(--k,0);background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:5px 14px;font-size:12.5px;font-weight:800;white-space:nowrap;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.pvh.t{top:max(14px,env(safe-area-inset-top,0px))} .pvh.b{bottom:max(16px,env(safe-area-inset-bottom,0px))}
.pvh.go{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.sheet .grab{height:22px;flex:none;display:grid;place-items:center;cursor:grab;border:0;background:none;width:100%;touch-action:none}
.sheet .grab::before{content:'';width:40px;height:4px;border-radius:2px;background:var(--line)}

.sheet.gone{animation:fade .25s reverse forwards}

/* Action menu (long press / right click / swipe left) and the dialog */
.mn{position:absolute;inset:0;z-index:30;background:rgba(5,3,12,.4);animation:fade .15s}
.mn .box{position:absolute;min-width:230px;max-width:min(320px,92%);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 14px 40px rgba(0,0,0,.6);animation:pop .22s var(--ease);transform-origin:var(--ox,50%) var(--oy,0)}
.mn .box.bot{left:8px;right:8px;bottom:max(8px,env(safe-area-inset-bottom,0px));max-width:none;transform-origin:50% 100%;animation:up .28s var(--ease)}
.mn h4{margin:4px 10px 6px;font-size:12px;color:var(--dim);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mn .mi{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;border-radius:9px;padding:9px 10px;text-align:left;font-weight:700;font-size:13.5px;animation:rise .25s var(--ease) backwards}
.mn .mi:hover,.mn .mi:focus-visible{background:var(--card2)}
.mn .mi i{font-style:normal;width:20px;text-align:center}
.mn .mi.dng{color:var(--bug)}
.dlg{position:absolute;inset:0;z-index:35;background:rgba(5,3,12,.6);display:grid;place-items:center;padding:16px;animation:fade .15s}
.dlg .box{width:min(360px,100%);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:10px;animation:pop .25s var(--ease)}
.dlg.stay,.dlg.stay .box,.mn.stay,.mn.stay .box{animation:none}
.dlg h4{margin:0;font:600 16px var(--f-disp)}
/* Help: how the page is driven, opened by the (i) in the header */
.ib.inf{border-color:transparent;background:none;color:var(--dim2);width:30px}
.ib.inf svg{width:20px;height:20px}
.ib.inf:hover{color:var(--dim)}
.dlg .box.help{width:min(460px,100%);max-height:86%;overflow:auto;gap:12px;font-size:14.5px;line-height:1.45}
.help h5{margin:6px 0 0;font:600 15px var(--f-disp);color:var(--gold)}
.help ul{margin:0;padding-left:18px;display:grid;gap:5px}
.help b{color:var(--txt)}
.help .hh{display:flex;align-items:center;gap:8px}
.help .hh h4{flex:1}
.dlg p{margin:0;color:var(--dim);font-size:13px}
.dlg .box.letter{width:min(640px,100%);max-height:92%;overflow:auto}
.dlg .box.letter textarea{min-height:92px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%}
.dlg .box.letter .ltframe{width:100%;height:460px;border:0;border-radius:12px;background:#fff}
.dlg .box.letter input{width:100%}
.ltt{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.ltt .btn[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.mbox{display:grid;gap:6px;margin:10px 0}
.tog{display:flex;align-items:center;gap:8px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px;font-weight:700}
.tog i{width:34px;height:20px;border-radius:99px;background:#3a2d62;position:relative;flex:none}
.tog i::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#9d91c4;transition:transform .15s}
.tog.on{border-color:var(--gold)}
.tog.on i{background:#6a5420}
.tog.on i::after{transform:translateX(14px);background:var(--gold)}
.tog:disabled{opacity:.45;cursor:default}
.em{color:var(--gold);font-size:12px;margin-left:2px}
.dlg input{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.dlg .row2{display:flex;gap:8px;justify-content:flex-end}

#lb{position:fixed;inset:0;background:rgba(5,3,12,.92);display:grid;place-items:center;z-index:50;cursor:zoom-out;animation:fade .2s}
#lb img{max-width:96vw;max-height:94vh;border-radius:8px;animation:pop .3s var(--ease)}
.gate{max-width:420px;margin:12vh auto;padding:24px;background:var(--card);border-radius:16px;border:1px solid var(--line);display:grid;gap:12px}
.gate input{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 12px}
.toast{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:7px 14px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.5);max-width:90%;text-align:center;animation:toast .3s var(--ease)}

/* One-shot entrances (the class is set only on the render that should play them) */
.a-list .sw{animation:rise .35s var(--ease) backwards;animation-delay:calc(min(var(--i,0),14) * 22ms)}

/* ==================== Analytics ==================== */
function bars(vals,{ sel, cols, cap, act, lp }){
  const m=Math.max(1,...vals.map(v=>v.reduce((a,b)=>a+b,0))), top=m<=4 ? 4 : Math.ceil(m/4)*4;
  return `<div class="cc"><div class="ya"><span>${top}</span><span>${top/2}</span><span>0</span></div>
    <div class="bars">${vals.map((v,i)=>`<button class="b${sel!=null ? (sel===i ? ' on' : ' dim') : ''}" style="--i:${i}" data-act="${act}" data-i="${i}"${lp ? ` data-lp="${lp}"` : ''} title="${esc(cap(i))}">${v.map((x,j)=>x ? `<i style="height:${x/top*100}%;background:${cols[j]}"></i>` : '').reverse().join('')}</button>`).join('')}</div>
    <div class="xa"><span>${dayShort(DAYS-1)}</span><span>${dayShort(20)}</span><span>${dayShort(13)}</span><span>${dayShort(6)}</span><span>сегодня</span></div></div>`;
}
function facet(dim){
  const D=DIMS[dim], c={}, b={}, cur=S.F[dim], no=S.F.not[dim];
  for(const r of REPS) if(match(r,dim)){ const k=D.k(r); c[k]=(c[k]||0)+1; if(r.kind==='bug') b[k]=(b[k]||0)+1; }
  const keys=Object.keys(c).sort((x,y)=>D.o(x,y,c)), mx=Math.max(1,...Object.values(c)), lim=S.all ? keys.length : 8;
  if(!keys.length) return '<div class="empty" style="padding:16px">Нет данных</div>';
  return `<div class="bl">${keys.slice(0,lim).map(k=>`<button class="bi${cur===k ? ' on' : ''}${no.includes(k) ? ' no' : ''}" data-act="fac" data-d="${dim}" data-k="${esc(k)}" data-lp="fac"><span class="l">${D.l(k)}</span>
    <span class="tr"><i style="width:${(b[k]||0)/mx*100}%;background:var(--bug)"></i><i style="width:${(c[k]-(b[k]||0))/mx*100}%;background:var(--op)"></i></span><span class="v">${c[k]}</span></button>`).join('')}
    ${keys.length>lim ? `<button class="more" data-act="all">Показать все ${keys.length}</button>` : S.all && keys.length>8 ? '<button class="more" data-act="all">Свернуть</button>' : ''}</div>`;
}
function matrix(){

  const c={}; for(const r of L){ const k=r.lv+'|'+r.ver; c[k]=(c[k]||0)+1; }
  const lvs=[...new Set(L.map(r=>r.lv))].sort((a,b)=>lvOrd(a)-lvOrd(b)), mx=Math.max(1,...Object.values(c));
  if(!lvs.length) return '<div class="empty" style="padding:16px">Нет данных</div>';
  return `<div class="hm"><table><colgroup><col class="n">${vs.map(()=>'<col>').join('')}</colgroup><thead><tr><th></th>${vs.map(v=>`<th title="v${esc(v)}">${esc(v.split('.').slice(-2).join('.'))}</th>`).join('')}</tr></thead><tbody>${lvs.map(l=>`<tr><th title="${esc(l)}">${esc(l)}</th>${vs.map(v=>{ const n=c[l+'|'+v]||0;
    return `<td><button class="${n ? '' : 'z'}${S.F.lv===l && S.F.ver===v ? ' on' : ''}" style="--a:${(.15+n/mx*.85).toFixed(2)}" data-act="cell" data-l="${esc(l)}" data-v="${esc(v)}" title="${esc(l)} · v${esc(v)}: ${n}">${n||''}</button></td>`; }).join('')}</tr>`).join('')}</tbody></table></div>`;
}

function menuFor(kind,el){
  const F=S.F, it=[];

    it.push([r.state!=='closed' ? '✓' : '↺',r.state!=='closed' ? 'Закрыть' : 'Открыть снова',()=>setState(r)]);
    it.push(['⚙',r.state==='wip' ? 'Снять «в работе»' : 'В работу',()=>setState(r,r.state==='wip' ? 'open' : 'wip')]);
    it.push(['✓',r.state==='done' ? 'Снять «выполнено»' : 'Выполнено',()=>setState(r,r.state==='done' ? 'open' : 'done')]);
    it.push(['⇄',r.kind==='bug' ? 'Сделать впечатлением' : 'Сделать ошибкой',()=>setKind(r)]);
    if(r.tester) it.push(['↩','Ответить',()=>{ openRep(r,true); S.focus='repText'; }]);
    it.push(['👤','Все отзывы '+r.who,()=>{ Object.assign(F,{ who:r.who, state:'' }); anim('list'); }]);
    if(r.lv) it.push(['📍','Все на «'+r.lv+'»',()=>{ Object.assign(F,{ lv:r.lv, state:'' }); anim('list'); }]);
    if(r.lv) it.push(['⊘','Скрыть уровень «'+r.lv+'»',()=>notF('lv',r.lv)]);
    it.push(['⧉','Копировать ссылку',()=>copy(location.origin+location.pathname+'#'+r.n,'Ссылка скопирована')]);
    if(r.text) it.push(['❝','Копировать текст',()=>copy(r.text,'Текст скопирован')]);

    if(body.on===false) cur.delete(body.tag); else cur.add(String(body.tag||'').trim().toLowerCase()); if(cur.size) b[id]=[...cur]; else delete b[id]; return DD.tags; }
  let m=path.match(/^\/issue\/(\d+)\/text$/); if(m){ const i=DD.list.find(x=>x.n===+m[1]); if(i && i.meta) i.meta.text=body.text; return { ok:true, text:body.text }; }
  m=path.match(/^\/issue\/(\d+)\/reply$/); if(m){ const a=DD.reps[m[1]]||(DD.reps[m[1]]=[]); if(body) a.push({ text:body.text, at:new Date().toISOString(), wait:true, shot:!!(body.shots && body.shots.length || body.shot), shots:(body.shots||[]).length||(body.shot?1:0), voice:body.audio ? 'webm' : null, dur:body.audio && body.audio.dur || 0 }); return { replies:a, fixed:false }; }
  m=path.match(/^\/issue\/(\d+)\/delete$/); if(m){ DD.list=DD.list.filter(x=>x.n!==+m[1]); return { ok:true, how:'deleted' }; }
  m=path.match(/^\/issue\/(\d+)$/); if(m && body.kind){ const i=DD.list.find(x=>x.n===+m[1]); if(i){ i.labels=i.labels.filter(l=>l!=='bug' && l!=='opinion').concat(body.kind); i.meta.kind=body.kind; } return { ok:true }; }
  m=path.match(/^\/issue\/(\d+)$/); if(m){ const i=DD.list.find(x=>x.n===+m[1]); if(i){ i.state=body.state==='closed' ? 'closed' : 'open'; i.labels=i.labels.filter(l=>l!=='wip'&&l!=='done').concat(body.state==='wip'||body.state==='done' ? [body.state] : []); } return { ok:true }; }
  if(path==='/mail/version'){ if(!body) return { ready:true, last:DD.mailLast||null };
    const ver=String(body.ver||'').trim(); if(!/^[\w.\-+]{1,24}$/.test(ver)) throw new Error('ver');
    const items=(body.items||[]).filter(Boolean); if(!items.length) throw new Error('empty');
    const html='<!doctype html><body style="margin:0;background:#06262b;padding:28px;font:16px/1.45 Segoe UI,sans-serif"><div style="max-width:560px;margin:0 auto;background:#0d4850;color:#e3f7f4;padding:24px"><div style="color:#5eead4;letter-spacing:.14em;font-size:12px">DATA CUBE | EXPEDITION LOG</div><h1 style="margin:6px 0 14px;font-size:22px">Обновление '+ver+'</h1>'+items.map((x,i)=>'<p><b style="color:#5eead4">'+String(i+1).padStart(2,"0")+'</b> '+x.replace(/</g,'&lt;')+'</p>').join('')+'</div></body>';
    if(body.preview) return { html };
    const sent=DD.testers.filter(t=>t.email && t.mver!==false && !t.ban).length; DD.mailLast={ ver, at:Date.now(), sent, fail:0 }; return { ok:true, sent, fail:0, n:sent }; }
  m=path.match(/^\/testers\/(\w+)$/); if(m){ const t=DD.testers.find(x=>x.id===body.id); if(m[1]==='rename') t.nick=body.to; if(m[1]==='ban') t.ban=body.on; if(m[1]==='mail'){ if('reply' in body) t.mreply=!!body.reply; if('ver' in body) t.mver=!!body.ver; return { ok:true, mreply:t.mreply!==false, mver:t.mver!==false }; } if(m[1]==='delete') DD.testers.splice(DD.testers.indexOf(t),1); return { ok:true, nick:t && t.nick }; }
  throw new Error('demo: '+path);
}
