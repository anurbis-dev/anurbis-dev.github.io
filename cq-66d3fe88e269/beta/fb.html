<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Feedback replay</title>
<!-- Replays a feedback snapshot: fetches it from the worker (?id=&k=), puts it into sessionStorage and opens the game (../index.html?fbx)
     in a frame of the tester's window size. The game keeps every key in memory — your own saves are not touched. -->
<script src="config.js"></script>
<style>
:root{color-scheme:dark}
html,body{margin:0;height:100%;background:#17102c;color:#eee8fa;font:14px/1.35 system-ui,sans-serif}
body{display:flex;flex-direction:column}
#bar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:8px 12px;background:#2a1d50;border-bottom:1px solid #4b3a80}
#bar b{color:#ffd66b}
#bar .warn{color:#ff9aa8;font-weight:600}
#bar button,#bar a{font:inherit;color:inherit;background:#3d2c72;border:1px solid #6a58a8;border-radius:6px;padding:4px 10px;cursor:pointer;text-decoration:none}
#bar .sp{flex:1}
#stage{flex:1;position:relative;overflow:hidden;display:grid;place-items:center}
#box{position:relative;flex:none;transform-origin:center;box-shadow:0 0 0 1px #6a58a8,0 8px 40px rgba(0,0,0,.6)}
#box iframe{border:0;width:100%;height:100%;display:block;background:#000}
#err{padding:24px;color:#ff9aa8;white-space:pre-wrap}
details{padding:0 12px 8px;background:#2a1d50}
details pre{max-height:30vh;overflow:auto;background:#120c22;padding:8px;border-radius:6px;font-size:12px}
</style>
</head>
<body>
<div id="bar">Loading…</div>
<details id="more" hidden><summary>Details</summary><pre id="raw"></pre></details>
<div id="stage"></div>
<script>
(async function(){
  const q=new URLSearchParams(location.search), id=q.get('id'), k=q.get('k')||'', api=(q.get('api')||window.CUBE_FB_API||'').replace(/\/$/,'');
  const bar=document.getElementById('bar'), stage=document.getElementById('stage');
  const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const fail=m=>{ bar.textContent='Feedback replay'; stage.innerHTML='<div id="err">'+esc(m)+'</div>'; };
  if(!id) return fail('No ?id= in the address.');
  let snap;
  try{ const r=await fetch(api+'/snap/'+encodeURIComponent(id)+'?k='+encodeURIComponent(k)); if(!r.ok) throw new Error('HTTP '+r.status+': '+await r.text()); snap=await r.json(); }
  catch(e){ return fail('Could not load the snapshot: '+e.message); }
  if(!snap || !snap.st || !snap.ls) return fail('The snapshot is empty or broken.');
  sessionStorage.setItem('cube-fb-snap',JSON.stringify(snap));
  const s=snap.sum||{}, W=s.w||1280, H=s.h||800;
  let ver=''; try{ const html=await (await fetch('../index.html',{ cache:'no-store' })).text(); ver=(html.match(/const VERSION = '([^']+)'/)||[])[1]||''; }catch(e){}
  bar.innerHTML=[
    '<b>'+esc(s.level||s.lvId)+'</b>'+(s.sub ? ' → '+esc(s.sub) : '')+' · '+esc(s.area||'')+' #'+esc(s.n),
    esc(s.ui||'game')+' · '+esc(s.state),
    W+'×'+H+' @'+esc(s.dpr)+' · '+esc(s.q && s.q.fps)+' fps',
    'v'+esc(s.ver)+(ver && ver!==s.ver ? ' <span class="warn">(game is v'+esc(ver)+' now — state may not match)</span>' : ''),
    '<span class="sp"></span>',
    '<button id="fit">1:1</button>','<button id="re">Reload</button>','<a href="../index.html?fbx" target="_blank" rel="opener">Full window</a>'
  ].join(' ');
  if(s.errs && s.errs.length || s.ua){ document.getElementById('more').hidden=false;
    document.getElementById('raw').textContent='UA: '+s.ua+'\n\nErrors:\n'+(s.errs||[]).map(e=>e[0]+'ms  '+e[1]).join('\n'); }
  const box=document.createElement('div'); box.id='box'; box.style.width=W+'px'; box.style.height=H+'px';
  const fr=document.createElement('iframe'); fr.src='../index.html?fbx'; fr.allow='autoplay; fullscreen'; box.append(fr); stage.append(box);
  let fit=true;
  const scale=()=>{ const k=fit ? Math.min(1,stage.clientWidth/W,stage.clientHeight/H) : 1; box.style.transform='scale('+k+')'; document.getElementById('fit').textContent=fit ? '1:1' : 'Fit'; };
  addEventListener('resize',scale); scale();
  document.getElementById('fit').onclick=()=>{ fit=!fit; scale(); };
  document.getElementById('re').onclick=()=>{ fr.src='../index.html?fbx&r='+Date.now(); };
})();
</script>
</body>
</html>
