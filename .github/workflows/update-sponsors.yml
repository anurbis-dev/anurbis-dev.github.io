# Refreshes the "Top supporters" block in index.html from the GitHub Sponsors
# GraphQL API (public sponsorships only). Requires the SPONSORS_TOKEN secret:
# a classic PAT owned by the anurbis-dev account with the `read:user` scope —
# the default Actions GITHUB_TOKEN cannot read sponsorship data.
name: Update sponsors

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Update Top supporters
        env:
          SPONSORS_TOKEN: ${{ secrets.SPONSORS_TOKEN }}
        run: node scripts/update-sponsors.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No sponsor changes"
            exit 0
          fi
          git commit -m "chore: update Top supporters"
          git push
